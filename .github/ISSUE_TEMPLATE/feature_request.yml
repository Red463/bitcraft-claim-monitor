name: Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature or improvement.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the issue or limitation
      placeholder: Explain the pain point or missing functionality
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
      placeholder: Describe your idea
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other solutions or workarounds you've considered?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, screenshots, examples, links, etc.
