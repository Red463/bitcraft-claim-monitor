name: Question
description: Ask a question about the project
title: "[Question]: "
labels:
  - question

body:
  - type: markdown
    attributes:
      value: |
        Please check the documentation and discussions before opening a question.

  - type: textarea
    id: question
    attributes:
      label: Your question
      placeholder: Ask your question here
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or extra information if relevant
