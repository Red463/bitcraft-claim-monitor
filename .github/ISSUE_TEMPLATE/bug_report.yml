name: Bug Report
description: Report something that is broken or not working correctly
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue clearly
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Paste screenshots, logs, or errors here

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome, Firefox, Edge, etc.

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11, Ubuntu, macOS, etc.

  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: v1.0.0
