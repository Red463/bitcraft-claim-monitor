name: Deploy production

on:
  workflow_dispatch:
    inputs:
      force_database_backup:
        description: Create a manual database backup even when the schema is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Check out verified revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Test application
        run: corepack pnpm --filter @workspace/bitcraft-local test
      - name: Build application
        run: corepack pnpm --filter @workspace/bitcraft-local run build
      - name: Test deployment contracts
        run: node --test scripts/test/deploy-*.test.mjs
      - name: Validate systemd units
        run: |
          systemd-analyze verify \
            deploy/bitcraft-claim-monitor.service \
            deploy/bitcraft-claim-monitor-worker.service \
            deploy/bitcraft-monitor-collector.service \
            deploy/bitcraft-monitor-collector.timer \
            deploy/bitcraft-claim-monitor-backup.service \
            deploy/bitcraft-claim-monitor-backup.timer

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Configure pinned SSH identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy verified revision
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          FORCE_DATABASE_BACKUP: ${{ inputs.force_database_backup }}
        run: |
          BACKUP_OPTION=""
          if [[ "$FORCE_DATABASE_BACKUP" == "true" ]]; then
            BACKUP_OPTION=" --force-backup"
          fi
          set +e
          DEPLOY_OUTPUT="$(ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$VPS_DEPLOY_USER@$VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-monitor --revision '$GITHUB_SHA'$BACKUP_OPTION" 2>&1)"
          DEPLOY_STATUS=$?
          set -e

          printf '%s\n' "$DEPLOY_OUTPUT"
          {
            printf '## Production deployment\n\n'
            printf 'Revision: `%s`  \n' "$GITHUB_SHA"
            printf 'Host: `%s`  \n' "$VPS_HOST"
            printf 'Result: `%s`\n\n' "$([[ "$DEPLOY_STATUS" -eq 0 ]] && printf success || printf failed)"
            printf '```text\n%s\n```\n' "$DEPLOY_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$DEPLOY_STATUS"
