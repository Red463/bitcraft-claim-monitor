name: Configure public Claim Monitor Caddy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type claim-monitor.com exactly to configure the public proxy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: relay-public-caddy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require exact main revision and public host
        env:
          CUTOVER_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CUTOVER_CONFIRMATION" = "claim-monitor.com"
          test "${#GITHUB_SHA}" -eq 40
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test public Caddy bootstrap
        run: node --test scripts/test/deploy-public-caddy.test.mjs scripts/test/deploy-public-caddy-workflow.test.mjs
      - name: Validate reviewed Caddy reference
        run: |
          docker run --rm \
            -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.3-alpine \
            caddy validate --config /etc/caddy/Caddyfile

  configure:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: relay-cutover
    steps:
      - name: Configure pinned SSH identity
        env:
          RELAY_VPS_SSH_PRIVATE_KEY: ${{ secrets.RELAY_VPS_SSH_PRIVATE_KEY }}
          RELAY_VPS_KNOWN_HOSTS: ${{ secrets.RELAY_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$RELAY_VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RELAY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify installed updater capability
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --capabilities" \
            | grep -Fqx 'public-caddy-bootstrap-v2'
      - name: Configure reviewed public hosts
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --revision '$GITHUB_SHA' --configure-public-caddy --confirmation 'claim-monitor.com'" \
            >/dev/null
      - name: Verify Timbersteel and public TLS routing
        run: |
          curl --fail --silent --show-error https://app.timbersteeltrade.com/api/local/health >/dev/null
          for attempt in {1..30}; do
            if PROFILE="$(curl --fail --silent --show-error https://claim-monitor.com/api/profile 2>/dev/null)" \
              && node -e '
                const value = JSON.parse(process.argv[1]);
                process.exit(value.profile?.id === "public"
                  && value.features?.publicProfileEnabled === false
                  && value.features?.publicCollaborationEnabled === false
                  && value.features?.publicLegalConfigurationConfirmed === false ? 0 : 1);
              ' "$PROFILE"; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then exit 1; fi
            sleep 2
          done
          curl --fail --silent --show-error --head https://www.claim-monitor.com/ \
            | tr -d '\r' \
            | grep -Eiq '^location: https://claim-monitor\.com/'
          printf '## Public Claim Monitor Caddy\n\nResult: `configured`  \nPublic feature flags: `disabled`\n' >> "$GITHUB_STEP_SUMMARY"
