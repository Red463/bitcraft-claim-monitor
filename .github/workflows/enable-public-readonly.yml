name: Enable public Claim Monitor read-only profile

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type claim-monitor.com exactly to enable public read-only settlement data
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: relay-public-readonly
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require exact main revision and public host
        env:
          ACTIVATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ACTIVATION_CONFIRMATION" = "claim-monitor.com"
          test "${#GITHUB_SHA}" -eq 40
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test protected public read-only activation
        run: node --test scripts/test/deploy-public-readonly-activation.test.mjs scripts/test/deploy-public-readonly-workflow.test.mjs
      - name: Validate activation helper
        run: node --check deploy/enable-public-readonly.mjs

  approve:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: relay-cutover
    steps:
      - name: Record public read-only approval
        run: printf 'Public read-only approval admitted for %s.\n' "$GITHUB_SHA"

  activate:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: relay-preview
    steps:
      - name: Configure pinned SSH identity
        env:
          RELAY_VPS_SSH_PRIVATE_KEY: ${{ secrets.RELAY_VPS_SSH_PRIVATE_KEY }}
          RELAY_VPS_KNOWN_HOSTS: ${{ secrets.RELAY_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$RELAY_VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RELAY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify installed updater capability
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --capabilities" \
            | grep -Fqx 'public-readonly-v2'
      - name: Capture Timbersteel invariant baseline
        run: |
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-health.json" https://app.timbersteeltrade.com/api/local/health
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-bootstrap.json" https://app.timbersteeltrade.com/api/local/bootstrap
          CLAIM_ID="$(node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const claimId = String(value.config?.claimId || "");
            if (!/^(0|[1-9][0-9]*)$/.test(claimId)) process.exit(1);
            process.stdout.write(claimId);
          ' "$RUNNER_TEMP/ts-bootstrap.json")"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-plan.json" \
            "https://app.timbersteeltrade.com/api/local/craft-plan?claimId=$CLAIM_ID"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-history.json" \
            "https://app.timbersteeltrade.com/api/local/history?claimId=$CLAIM_ID&include=activity&activityLimit=1"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-notifications.json" \
            "https://app.timbersteeltrade.com/api/local/notification-activity?claimId=$CLAIM_ID&limit=1"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-collectors.json" \
            https://app.timbersteeltrade.com/api/local/collector-status
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-admin.json" \
            https://app.timbersteeltrade.com/api/local/admin/me
          curl --fail --silent --show-error https://app.timbersteeltrade.com/bot >/dev/null
          node -e '
            const fs = require("node:fs"); const root = process.argv[1];
            const read = (name) => JSON.parse(fs.readFileSync(`${root}/ts-${name}.json`, "utf8"));
            const health = read("health"); const bootstrap = read("bootstrap"); const plan = read("plan");
            const history = read("history"); const notifications = read("notifications");
            const collectors = read("collectors"); const admin = read("admin");
            if (health.ok !== true || !plan.config || !history || !notifications || !collectors.collectors
              || admin.authenticated !== false || typeof admin.discordLoginEnabled !== "boolean") process.exit(1);
            fs.writeFileSync(`${root}/timbersteel-baseline.json`, JSON.stringify({
              version: health.version, buildSha: health.buildSha,
              claimId: String(bootstrap.config.claimId), claimName: String(bootstrap.config.claimName || ""),
              planConfig: plan.config, collectorEnabled: collectors.enabled,
              collectorKeys: Object.keys(collectors.collectors).sort(),
              adminDiscordLoginEnabled: admin.discordLoginEnabled,
            }));
          ' "$RUNNER_TEMP"
      - name: Activate public read-only profile
        id: activation
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --revision '$GITHUB_SHA' --enable-public-readonly --confirmation 'claim-monitor.com'" \
            > "$RUNNER_TEMP/public-readonly-activation.json"
          touch "$RUNNER_TEMP/public-readonly-activated"
          node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            process.exit(value.ok === true && value.timbersteelFingerprints === "unchanged" ? 0 : 1);
          ' "$RUNNER_TEMP/public-readonly-activation.json"
      - name: Verify isolated Stage 1 production state
        run: |
          curl --fail --silent --show-error https://app.timbersteeltrade.com/api/local/health >/dev/null
          curl --fail --silent --show-error https://app.timbersteeltrade.com/bot >/dev/null
          curl --fail --silent --show-error --output "$RUNNER_TEMP/public-profile.json" \
            https://claim-monitor.com/api/profile
          curl --fail --silent --show-error --output "$RUNNER_TEMP/public-search.json" \
            'https://claim-monitor.com/api/public/settlements/search?q=tim'
          CLAIM_ID="$(node -e '
            const search = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const claimId = String(search.hints[0].claimId || "");
            if (!/^(0|[1-9][0-9]*)$/.test(claimId)) process.exit(1);
            process.stdout.write(claimId);
          ' "$RUNNER_TEMP/public-search.json")"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/public-snapshot.json" \
            "https://claim-monitor.com/api/public/settlements/$CLAIM_ID?domains=claim%2Cmembers%2Ccitizens%2Cinventories%2Ccrafts"
          node -e '
            const fs = require("node:fs"); const root = process.argv[1];
            const profile = JSON.parse(fs.readFileSync(`${root}/public-profile.json`, "utf8"));
            const search = JSON.parse(fs.readFileSync(`${root}/public-search.json`, "utf8"));
            const snapshot = JSON.parse(fs.readFileSync(`${root}/public-snapshot.json`, "utf8"));
            const domains = ["claim", "members", "citizens", "inventories", "crafts"];
            process.exit(profile.profile?.id === "public"
              && profile.features?.publicProfileEnabled === true
              && profile.features?.publicCollaborationEnabled === false
              && profile.features?.publicLegalConfigurationConfirmed === true
              && Array.isArray(search.hints)
              && snapshot.claimId === process.argv[2]
              && domains.every((domain) => Object.hasOwn(snapshot.domains || {}, domain)) ? 0 : 1);
          ' "$RUNNER_TEMP" "$CLAIM_ID"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST https://claim-monitor.com/api/public/auth/discord/start)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            https://claim-monitor.com/bot)" = "404"
          printf '## Public Claim Monitor Stage 1\n\nProfile: `read-only`  \nCollaboration: `disabled`  \nWorker: `unchanged`\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Timbersteel invariant baseline
        run: |
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-health.json" https://app.timbersteeltrade.com/api/local/health
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-bootstrap.json" https://app.timbersteeltrade.com/api/local/bootstrap
          CLAIM_ID="$(node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            process.stdout.write(String(value.config?.claimId || ""));
          ' "$RUNNER_TEMP/ts-bootstrap.json")"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-plan.json" \
            "https://app.timbersteeltrade.com/api/local/craft-plan?claimId=$CLAIM_ID"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-history.json" \
            "https://app.timbersteeltrade.com/api/local/history?claimId=$CLAIM_ID&include=activity&activityLimit=1"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-notifications.json" \
            "https://app.timbersteeltrade.com/api/local/notification-activity?claimId=$CLAIM_ID&limit=1"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-collectors.json" \
            https://app.timbersteeltrade.com/api/local/collector-status
          curl --fail --silent --show-error --output "$RUNNER_TEMP/ts-admin.json" \
            https://app.timbersteeltrade.com/api/local/admin/me
          node -e '
            const assert = require("node:assert/strict"); const fs = require("node:fs"); const root = process.argv[1];
            const read = (name) => JSON.parse(fs.readFileSync(`${root}/ts-${name}.json`, "utf8"));
            const health = read("health"); const bootstrap = read("bootstrap"); const plan = read("plan");
            const collectors = read("collectors"); const admin = read("admin");
            read("history"); read("notifications");
            const baseline = JSON.parse(fs.readFileSync(`${root}/timbersteel-baseline.json`, "utf8"));
            const current = {
              version: health.version, buildSha: health.buildSha,
              claimId: String(bootstrap.config.claimId), claimName: String(bootstrap.config.claimName || ""),
              planConfig: plan.config, collectorEnabled: collectors.enabled,
              collectorKeys: Object.keys(collectors.collectors || {}).sort(),
              adminDiscordLoginEnabled: admin.discordLoginEnabled,
            };
            assert.deepEqual(current, baseline);
          ' "$RUNNER_TEMP"
      - name: Fail closed after external verification failure
        if: failure()
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          test -f "$RUNNER_TEMP/public-readonly-activated" || exit 0
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --revision '$GITHUB_SHA' --disable-public-readonly --confirmation 'claim-monitor.com'"
