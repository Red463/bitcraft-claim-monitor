name: Install public Claim Monitor OAuth credentials

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type claim-monitor.com exactly to install the protected public OAuth credentials
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: relay-public-oauth-credentials
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require exact main revision and public host
        env:
          INSTALL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$INSTALL_CONFIRMATION" = "claim-monitor.com"
          test "${#GITHUB_SHA}" -eq 40
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test protected public OAuth credential installation
        run: node --test scripts/test/deploy-public-oauth-credentials.test.mjs scripts/test/deploy-public-oauth-workflow.test.mjs
      - name: Validate credential helper
        run: node --check deploy/install-public-oauth-credentials.mjs

  approve:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: relay-cutover
    steps:
      - name: Record public OAuth credential approval
        run: printf 'Public OAuth credential approval admitted for %s.\n' "$GITHUB_SHA"

  install:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: relay-preview
    steps:
      - name: Configure pinned SSH identity
        env:
          RELAY_VPS_SSH_PRIVATE_KEY: ${{ secrets.RELAY_VPS_SSH_PRIVATE_KEY }}
          RELAY_VPS_KNOWN_HOSTS: ${{ secrets.RELAY_VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$RELAY_VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$RELAY_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify installed updater capability
        env:
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --capabilities" \
            | grep -Fqx 'public-oauth-credentials-v1'
      - name: Install credentials through protected stdin
        env:
          PUBLIC_DISCORD_OAUTH_CLIENT_ID: ${{ secrets.PUBLIC_DISCORD_OAUTH_CLIENT_ID }}
          PUBLIC_DISCORD_OAUTH_CLIENT_SECRET: ${{ secrets.PUBLIC_DISCORD_OAUTH_CLIENT_SECRET }}
          RELAY_VPS_HOST: ${{ secrets.RELAY_VPS_HOST }}
          RELAY_VPS_DEPLOY_USER: ${{ secrets.RELAY_VPS_DEPLOY_USER }}
        run: |
          set -o pipefail
          node -e '
            const clientId = process.env.PUBLIC_DISCORD_OAUTH_CLIENT_ID || "";
            const clientSecret = process.env.PUBLIC_DISCORD_OAUTH_CLIENT_SECRET || "";
            if (!/^[0-9]{17,20}$/.test(clientId) || !/^[A-Za-z0-9._~-]{24,128}$/.test(clientSecret)) {
              throw new Error("Protected public OAuth credentials are missing or malformed.");
            }
            process.stdout.write(JSON.stringify({ clientId, clientSecret }));
          ' | ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -- "$RELAY_VPS_DEPLOY_USER@$RELAY_VPS_HOST" \
            "sudo /usr/local/bin/update-bitcraft-claim-monitor-relay --revision '$GITHUB_SHA' --install-public-oauth-credentials --confirmation 'claim-monitor.com'"
      - name: Verify profiles remain isolated and disabled
        run: |
          curl --fail --silent --show-error https://app.timbersteeltrade.com/api/local/health >/dev/null
          PROFILE="$(curl --fail --silent --show-error https://claim-monitor.com/api/profile)"
          node -e '
            const value = JSON.parse(process.argv[1]);
            process.exit(value.profile?.id === "public"
              && value.features?.publicProfileEnabled === false
              && value.features?.publicCollaborationEnabled === false
              && value.features?.publicLegalConfigurationConfirmed === false ? 0 : 1);
          ' "$PROFILE"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST https://claim-monitor.com/api/public/auth/discord/start)" = "404"
          printf '## Public Claim Monitor OAuth credentials\n\nResult: `installed`  \nPublic feature flags: `disabled`  \nWorker: `unchanged`\n' >> "$GITHUB_STEP_SUMMARY"
